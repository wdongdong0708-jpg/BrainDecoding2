version: 1
primary: unified_protocol_v2
protocols:
- id: unified_protocol_v2
  role: primary
  title: 延迟滚动词／句子解码共同协议 v2
  datasets:
  - pallier2025
  - chineseeeg2_littleprince
  protocol: data/manifests/rolling_sentence/unified_protocol_v2.md
  config: configs/unified_rolling/v2.yaml
  entrypoints:
  - python scripts/replications/run_unified_rolling_v2.py --help
  - python -m braindecoding.unified_rolling_v2_training --help
  status_sources:
  - name: neural_training
    paths:
    - .cache/runs/unified_rolling_v2/status.json
    - data/results/protocols/unified_rolling_v2_queue_results.json
  - name: heldout_decode
    paths:
    - .cache/runs/unified_heldout_test_v2/status.json
  reports:
  - data/results/protocols/unified_rolling_v2_queue_results.json
  - data/results/studies/unified_heldout_test_v2
  - data/results/studies/unified_context_baselines_v2
  - data/results/studies/unified_context_heldout_test_v2
  - data/results/studies/full_context_sentence_test_v2
  - data/results/studies/full_vocabulary_context_test_v2
  - data/results/studies/word_paired_statistics_test_v2
  - data/results/studies/material_block_length_sensitivity_test_v2
  - data/results/studies/single_word_long_window_test_v2
  - data/results/studies/pure_language_baseline_test_v2
  - data/results/studies/f_local_sentence_test_v2
  retained_dependencies:
  - configs/word_decoding/pallier2025
  - configs/word_decoding/chineseeeg2_littleprince
  - outputs/word_decoding/pallier2025/baseline_alignment_bge_v1_retry1
  - outputs/word_decoding/chineseeeg2_littleprince/baseline_alignment_bge_16x16_v1
  - outputs/word_decoding/pallier2025/unified_rolling_v2
  - outputs/word_decoding/chineseeeg2_littleprince/unified_rolling_v2
  - outputs/word_decoding/unified_context_baselines_v2
  - outputs/sentence_decoding/unified_sentence_v2
  - outputs/sentence_decoding/unified_sentence_v2_preview
  - outputs/sentence_decoding/unified_sentence_v2_preview_chance
  - outputs/sentence_decoding/unified_sentence_v2_revision_gain_full
  - outputs/heldout_test/unified_heldout_test_v2
  - outputs/heldout_test/unified_context_heldout_test_v2
  - outputs/heldout_test/full_context_sentence_test_v2
  - data/cache/derived/models/qwen2_5_1_5b
  - .cache/runs/unified_context_baselines_v2/plan.json
