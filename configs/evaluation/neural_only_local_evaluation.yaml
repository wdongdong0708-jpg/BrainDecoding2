protocol:
  id: f_local_sentence_test_v2
  authorization_date: '2026-10-11'
  parent: data/manifests/rolling_sentence/heldout_test_v2.json
  full_context: data/manifests/rolling_sentence/full_context_sentence_test_v2.json
  datasets: [pallier2025, chineseeeg2_littleprince]
  seeds: [0, 1, 2]
  split: test
  training_allowed: false
  recalibration_allowed: false
  selection_allowed: false
representation:
  source: existing_C_shared_rolling_predictions
  horizon: min_2_remaining_words_in_same_segment
  segment_tail: K1_then_K0
decoding:
  compute_conditions: [F-local]
  report_conditions: [C, F-local, F]
  branch: open
  alignment: real
  search: single_full_segment_beam_from_empty_generated_prefix
  language_weight: 0.1
  candidates: 20
  beam_width: 5
  neural_scale: 10.0
  proposal_count: 5
  proposal_max_new_tokens: 16
  proposal_batch_size: 16
  score_batch_size: 32
  score_cache_size: 200000
  segment_batch_size: 16
  cache: private_snapshot_of_completed_F_language_cache
statistics:
  primary_metric: subject_equal_sentence_bleu1_then_seed_equal
  comparisons: [F-local_minus_C, F_minus_F-local, F_minus_C]
  material_block_size: 5
  material_block_bootstrap_repetitions: 10000
  bootstrap_interval: percentile_95
  stratification: recording_or_chapter
  shared_draws: all_conditions_subjects_and_seeds
  seed: 161803
  significance_tests: false
  evidence: supplementary_after_original_C_F_results
execution:
  segment_batch_size: 16
  torch_threads: 4
  minimum_free_gpu_memory_gib: 11
  gpu_memory_limit_gib: 10
  dataset_workers: sequential
  resume: contiguous_matching_chunks_and_exact_last_committed_cache
  cache_retention: latest_two_committed_snapshots_per_dataset
  stop: numerical_population_or_source_failure_only
