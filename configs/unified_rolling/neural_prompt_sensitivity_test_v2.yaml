protocol:
  id: neural_prompt_sensitivity_test_v2
  authorization_date: '2026-10-11'
  parent: data/manifests/rolling_sentence/heldout_test_v2.json
  language_control: data/manifests/rolling_sentence/pure_language_prompt_sensitivity_test_v2.json
  datasets: [pallier2025, chineseeeg2_littleprince]
  seeds: [0, 1, 2]
  split: test
  training_allowed: false
  recalibration_allowed: false
  prompt_selection_allowed: false
decoding:
  conditions: [A, C]
  matched_controls: {A: LM_A, C: LM_R}
  prompt: exact_completed_native_prose_language_control
  branch: open
  alignment: real
  language_weight: 0.1
  candidates: 20
  beam_width: 5
  neural_scale: 10.0
  proposal_count: 5
  proposal_max_new_tokens: 16
  proposal_batch_size: 16
  score_batch_size: 32
  score_cache_size: 200000
  segment_batch_size: 16
  cache: fresh_private_prompt_bound_cache
statistics:
  primary_metric: subject_equal_sentence_bleu1_then_neural_seed_equal
  comparisons: [C_minus_LM_R, A_minus_LM_A, C_minus_A]
  family: two_datasets_three_same_prompt_bleu_comparisons
  alternative: two_sided
  material_block_size: 5
  material_block_bootstrap_repetitions: 10000
  paired_material_block_sign_flips: 10000
  bootstrap_interval: percentile_95
  multiplicity: holm
  seed: 161803
  secondary_metrics: [wer, aligned_word_accuracy, bleu1]
  secondary_significance_tests: false
  original_prompt_comparisons: paired_intervals_only
  language_replicates_per_policy: 1
execution:
  segment_batch_size: 16
  torch_threads: 4
  minimum_free_gpu_memory_gib: 11
  gpu_memory_limit_gib: 10
  dataset_workers: sequential
  resume: contiguous_chunks_and_exact_last_committed_prompt_bound_cache
  cache_retention: latest_two_committed_snapshots_per_dataset
  automatic_results_export: true
  optional_B_C1: defer_until_primary_A_C_complete
