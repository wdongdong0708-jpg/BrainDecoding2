protocol:
  id: fixed_k0_rolling_search_test_v2
  authorization_date: '2026-10-08'
  authorization: user_prioritized_fixed_K0_rolling_text_search_baseline_B
  parent: data/manifests/rolling_sentence/heldout_test_v2.json
  split: test
  datasets: [pallier2025, chineseeeg2_littleprince]
  seeds: [0, 1, 2]
  training_allowed: false
  recalibration_allowed: false
population:
  source: entire_existing_heldout_AC_population
  retain_all_subjects_segments_words_and_material_blocks: true
decoding:
  compute_conditions: [B]
  report_conditions: [A, B, C]
  neural_representation: K0_only_for_every_position_at_every_arrival
  revision_words: 3
  branch: open
  alignment: real
  language_weight: 0.1
  inherit_all_parent_search_and_proposal_parameters: true
  prefix: own_generated_prefix_before_current_three_word_window
  read_K1_K2: false
reuse:
  A_C: authenticated_existing_final_outputs_and_arrival_traces
  neural: authenticated_existing_K0_cache_without_reencoding
  language_cache: copy_parent_generated_prefix_cache_into_separate_output
comparisons:
  primary: [B_minus_A, C_minus_B]
  total_reference: C_minus_A
  primary_metric: subject_equal_sentence_bleu1_then_seed_equal
  secondary: [aligned_word_accuracy_gain, wer_reduction]
  gain_shares: signed_component_over_C_minus_A_when_total_positive
  paired_transitions: [A_to_B, B_to_C, A_to_C]
  online_transitions: [B_first_to_final, C_first_to_final]
statistics:
  paired_material_block_sign_flips: 10000
  material_block_bootstrap_repetitions: 10000
  bootstrap_interval: percentile_95
  alternative: greater
  multiplicity: holm_four_supplementary_tests_two_comparisons_by_two_datasets
  seed: 161803
  evidence: supplementary_ablation_after_original_AC_results
  causal_interpretation: candidate_and_generated_prefix_interactions_remain
execution:
  entry: python -m braindecoding.fixed_k0_rolling_search_test_v2 run
  output_group: fixed_k0_rolling_search_test_v2
  segment_batch_size: 16
  progress_interval_seconds: 30
  resume: identical_manifest_authenticated_atomic_chunks_only
  stop: numerical_population_or_provenance_failure_only
  export_automatically_on_completion: true
