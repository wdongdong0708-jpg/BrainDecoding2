protocol:
  id: single_revision_c1_test_v2
  authorization_date: '2026-10-09'
  authorization: user_requested_C1_one_revision_one_subsequent_word_window
  parent: data/manifests/rolling_sentence/heldout_test_v2.json
  split: test
  datasets: [pallier2025, chineseeeg2_littleprince]
  seeds: [0, 1, 2]
  training_allowed: false
  recalibration_allowed: false
population:
  source: entire_existing_heldout_AC_population
  retain_all_subjects_segments_words_and_material_blocks: true
decoding:
  compute_conditions: [C1]
  report_conditions: [A, C1, C]
  neural_representation: K0_at_first_arrival_K1_at_only_revision
  maximum_revision_opportunities_per_word: 1
  maximum_wait_subsequent_word_windows: 1
  revision_words: 2
  end_of_segment: freeze_last_word_at_K0_without_extra_arrival
  read_K2: false
  branch: open
  alignment: real
  language_weight: 0.1
  inherit_parent_candidate_beam_and_proposal_parameters: true
  prefix: own_generated_prefix_before_current_two_word_window
reuse:
  A_C: authenticated_existing_final_outputs_and_arrival_traces
  neural: authenticated_existing_K0_K1_cache_without_reencoding
  language_cache: copy_parent_generated_prefix_cache_into_separate_output
comparisons:
  primary: [C1_minus_A, C_minus_C1]
  total_reference: C_minus_A
  primary_metric: subject_equal_sentence_bleu1_then_seed_equal
  secondary: [aligned_word_accuracy_gain, wer_reduction]
  gain_shares: signed_C1_minus_A_over_C_minus_A_when_total_positive
  paired_transitions: [A_to_C1, C1_to_C, A_to_C]
  online_transitions: [C1_first_to_final, C_first_to_final]
statistics:
  paired_material_block_sign_flips: 10000
  material_block_bootstrap_repetitions: 10000
  bootstrap_interval: percentile_95
  alternative: greater
  multiplicity: holm_four_supplementary_tests_two_comparisons_by_two_datasets
  seed: 161803
  evidence: supplementary_latency_ablation_after_original_AC_results
  causal_interpretation: neural_horizon_search_window_and_generated_prefix_interact
execution:
  entry: python -m braindecoding.single_revision_c1_test_v2 run
  segment_batch_size: 16
  progress_interval_seconds: 30
  resume: identical_manifest_authenticated_atomic_chunks_only
  export_automatically_on_completion: true
