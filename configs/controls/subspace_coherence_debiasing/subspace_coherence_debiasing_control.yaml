# 方案一（零重训 · 测试期即插即用）：低秩共模子空间投影 + 相干度门控去偏（Subspace-Projected + Coherence-Gated LOO）配置
# 核心思想：
#   1. 基于测试期 6 个纯历史因果时间错位窗口（-15s, -30s, -45s, -60s, -90s, -120s）的共模均值特征做中心化 SVD，
#      提取跨历史窗口共有的低秩时间偏置子空间 P_bias = U_K U_K^T（秩 K in [8, 12, 16, 24]，有效秩 EffRank = 1.7 ~ 2.2）；
#   2. 每个错位分支 k 严格仅使用其余 M-1=5 个错位条件的均值求中心化 SVD 基 U_{K,LOO}（完全不碰第 k 个错位条件自身）；
#   3. 结合可选跨历史窗口相干度门控 g_i = clamp((||y_shift_mean_i||_2 - 0.35) / (0.65 - 0.35), 0.2, 1.2)（默认同时对比 Gate=Off 与 Gate=On）；
#   4. 仅在低秩偏置子空间 U_K 内执行 LOO 共模扣除（eta in [0.8, 1.0, 1.2]），
#      100% 保护正交的 (D - K) 个纯神经语义维度免受 1 + eta^2 / M 噪声方差膨胀。
#
# 启动命令示例：
#   python -u -m braindecoding.evaluation.subspace_coherence_debiasing_evaluation --dataset pallier2025 --stage revision --split test --control-config configs/controls/subspace_coherence_debiasing/subspace_coherence_debiasing_control.yaml

extends: ../temporal_shift/temporal_shift_control.yaml

control:
  name: subspace_coherence_debiasing_negative_control
  control_type: subspace_coherence_debiasing
  description: Centered-SVD low-rank subspace-projected (U_K U_K^T with strict LOO basis U_{K,LOO}) and cross-shift coherence-gated leave-one-out common-mode debiasing across purely historical causal windows (-15s, -30s, -45s, -60s, -90s, -120s).
  shift_seconds: [-15.0, -30.0, -45.0, -60.0, -90.0, -120.0]
  shift_mode: deterministic_circular
  same_subject: true
  same_recording: true
  non_overlapping_window: true
  include_clean_reference: true
  include_zero_signal: false
  common_mode_subtraction:
    enabled: true
    mode: leave_one_out
    eta_values: [0.5, 0.8, 1.0]
    normalize_before_subtraction: true
  subspace_coherence_debiasing:
    enabled: true
    mode: subspace_coherence_leave_one_out
    rank_k_values: [8, 12]
    eta_values: [0.5,0.8, 1.0]
    full_loo_eta_values: [0.5, 0.8, 1.0]
    center_svd: true
    use_coherence_gate: false
    coherence_low: 0.35
    coherence_high: 0.65
    gate_min: 0.2
    gate_max: 1.2
    normalize_before_subtraction: true

evaluation:
  negative_control: subspace_coherence_debiasing
  shift_seconds: [-15.0, -30.0, -45.0, -60.0, -90.0, -120.0]
  zero_signal_control: false
  subspace_coherence_debiasing:
    enabled: true
    mode: subspace_coherence_leave_one_out
    rank_k_values: [8, 12]
    eta_values: [0.5,0.8, 1.0]
    center_svd: true
    use_coherence_gate: false
