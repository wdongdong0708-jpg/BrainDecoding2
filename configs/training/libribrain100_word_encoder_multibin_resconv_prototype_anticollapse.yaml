# LibriBrain100 英语 MEG 阶段 1（第三阶梯抗坍缩：同词多试次零重叠原型对齐 + 单试次 SigLIP 主损 + 轻度通道慢漂移增强）
# 训练期利用训练集内部同词 >=10s 零重叠多试次平均原型向 h_pre 与卷积主干回传高信噪比梯度，测试与下游 Stage-2 仍严格单试次 k=1。
# 产出的 model_state 与 MultiBinResConvEncoder 键名完全一致，可直接 strict=True 热启动 Op3A-v2 Stage-2。
# 启动命令：
#   python -u -m braindecoding train --config configs/training/libribrain100_word_encoder_multibin_resconv_prototype_anticollapse.yaml --require-cache --resume auto
extends: ./libribrain100_word_encoder_multibin_resconv_butterworth.yaml

model:
  conv:
    channel_offset_std: 0.10

loss:
  name: multi_trial_prototype_siglip
  single_weight: 1.0
  proto_pre_weight: 0.50
  proto_z_weight: 0.25
  min_group_size: 2
  initial_temperature: 10.0
  initial_bias: -10.0
  proto_initial_temperature: 12.0
  proto_initial_bias: -10.0
  identical_candidates_threshold: 0.999

training:
  epochs: 24
  batch_size: 512
  eval_batch_size: 1024
  learning_rate: 5.0e-4
  weight_decay: 0.01
  decoupled_weight_decay: true
  scheduler: step_cosine
  warmup_ratio: 0.05
  minimum_learning_rate: 1.0e-6
  max_grad_norm: 1.0
  ema_decay: 0.999
  patience: 6
  early_stop_metric: full_vocab
  word_sampling: multi_trial_prototype_sampler
  proto_group_size: 4
  min_gap_seconds: 2.5
  proto_min_gap_seconds: 10.0
