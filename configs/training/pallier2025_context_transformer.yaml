# Pallier2025 法语 MEG 阶段 2.1：词级脑编码器 + 16 层全局上下文 Transformer 训练配置（NVIDIA L4 GPU 默认调优）
# 说明：加载阶段 1（word）最佳检查点初始化 CNN 脑编码器，第 1 轮冻结 CNN，随后联合训练；使用完整上下文窗口，不启用局部窗口滚动修订。
# 启动命令：
#   python -u -m braindecoding train --config configs/training/pallier2025_context_transformer.yaml --require-cache --resume auto
extends: ../word_decoding/pallier2025/all_subjects/main_context_warmstart.yaml

workflow:
  dataset: pallier2025
  stage: context
  subject: all
  precision: bf16-mixed

experiment:
  output_group: unified_rolling_v2

cache:
  text_embeddings: data/cache/derived/pallier2025/text/t5_large_layer_0_5/embeddings.npz
  # 后续切换 BGE-M3 时改为：
  # text_embeddings: data/cache/derived/pallier2025/text/unified_bge_m3_v1/embeddings.npz

text_embedding:
  model_name: t5-large
  layer_fraction: 0.5
  token_aggregation: mean
  embedding_dimension: 1024
  batch_size: 32
  device: cpu
  local_files_only: true
  word_normalization: canonical_standard_word
  # 后续切换 BGE-M3 时改为：
  # model_name: BAAI/bge-m3
  # revision: 5617a9f61b028005a4858fdac845db406aefb181
  # backend: auto_model
  # layer_fraction: 1.0
  # token_aggregation: first
  # add_special_tokens: true
  # normalize_embeddings: true
  # embedding_dimension: 1024
  # max_length: 64
  # batch_size: 64
  # dtype: float16
  # device: cuda
  # local_files_only: true
  # word_normalization: canonical_standard_word

model:
  embedding_dimension: 1024
  use_transformer: true
  context_mode: grouped
  conv:
    merger_channels: 270
    merger_position_dimension: 2048
    merger_per_subject: true
    merger_dropout: 0.2
    initial_linear: 512
    hidden: 160
    depth: 5
    kernel_size: 3
    dilation_growth: 2
    dilation_period: 5
    dropout_input: 0.1
    convolution_dropout: 0.0
    batch_norm: true
    gelu: true
    skip: true
    glu_every: 2
    glu_context: 1
    temporal_attention_hidden: 256
  transformer:
    depth: 16
    heads: 16
    attention_dropout: 0.1
    feedforward_dropout: 0.0
    use_scalenorm: true
    use_rmsnorm: false
    rotary_position_embedding: true
    residual_attention: false
    scale_residual: true

loss:
  name: SigLip
  initial_temperature: 10.0
  initial_bias: -10.0
  identical_candidates_threshold: 0.999

training:
  seed: 0
  device: auto
  epochs: 30
  batch_size: 128
  eval_batch_size: 512
  validation_query_batch_size: 512
  learning_rate: 1e-4
  weight_decay: 0.0
  minimum_learning_rate: 0.0
  max_grad_norm: 0.0
  num_workers: 0
  patience: 10
  precision: bf16-mixed
  amp: true
  amp_dtype: bfloat16
  freeze_brain_encoder_epochs: 1
  preserve_complete_groups: true
  save_last_checkpoint: true
  warm_start_from: main_word
  warm_start_output_group: unified_rolling_v2
  scheduler: cosine_annealing_per_epoch
  record_amp_skipped_updates: true
  primary_checkpoint: best.pt
  secondary_checkpoint: best_full_vocab.pt
  warm_start_source: same_dataset_same_seed_word_best_pt
  top_ks: [1, 10]
  word_sampling: legacy_word_sampler

evaluation:
  default_split: val
  selection_metric: retrieval_acc10_vocab=pallier2025_50_macro
