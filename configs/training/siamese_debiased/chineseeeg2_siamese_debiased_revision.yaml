# ChineseEEG-2 中文《小王子》EEG 阶段 2.2：孪生共模抵消 + 跨状态错位跳变零化正则 + 冻结 CNN 预提取极速训练配置
# 启动命令：
#   python -u -m braindecoding train --config configs/training/siamese_debiased/chineseeeg2_siamese_debiased_revision.yaml --require-cache --resume auto
extends: ../chineseeeg2_rolling_revision.yaml

workflow:
  dataset: chineseeeg2_littleprince
  stage: revision
  subject: all
  precision: bf16-mixed
  window_seconds: 1.0
  window_start_offset_seconds: 0.0

training:
  epochs: 30
  batch_size: 128
  eval_batch_size: 512
  learning_rate: 1.0e-4
  weight_decay: 0.01
  patience: 6
  early_stop_metric: full_vocab
  freeze_brain_encoder_epochs: 30
  preserve_complete_groups: true
  revision_cutoff_policy: all

siamese_debiased:
  enabled: true
  eta_0: 0.40
  eta_train: 0.40
  eta_delta: 0.40
  lambda_null: 15.0
  lambda_delta_null: 80.0
  beta_delta_cm: 6.0
  shift_seconds: [-15.0, -30.0, -45.0, -60.0, -90.0, -120.0]
  shifts_per_step: 6 # M越大越好
  synchronize_dropout_rng: true
  preextract_frozen_cnn: true
  cache_preextracted_to_disk: true
