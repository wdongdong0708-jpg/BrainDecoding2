# Pallier2025 全量法语 MEG 阶段 2.3：纯因果 Pre-Roll 相干均值 + 词频加权零空间 + 跨步一致性前缀编码训练配置
extends: ../pallier2025_full_prefix_revision.yaml

workflow:
  dataset: pallier2025_full
  stage: prefix_revision
  subject: all
  precision: bf16-mixed
  window_seconds: 1.0
  window_start_offset_seconds: 0.0

training:
  epochs: 30
  batch_size: 128
  eval_batch_size: 512
  learning_rate: 1.0e-4
  weight_decay: 0.01
  patience: 6
  early_stop_metric: full_vocab
  freeze_brain_encoder_epochs: 30
  preserve_complete_groups: true
  revision_cutoff_policy: all

siamese_debiased:
  enabled: true
  debias_mode: null_space
  shift_mode: preroll
  preroll_seconds: 55.0
  eta_0: 0.50
  eta_train: 0.50
  eta_delta: 0.0
  lambda_null: 10.0
  lambda_delta: 0.45
  lambda_distill: 0.0
  beta_delta_cm: 0.0
  null_space_coherent_mean: true
  null_space_vocab_freq_alpha: 0.5
  shift_seconds: [-12.0, -19.0, -27.0, -36.0, -46.0]
  shifts_per_step: 5
  synchronize_dropout_rng: true
  preextract_frozen_cnn: true
  cache_preextracted_to_disk: true
