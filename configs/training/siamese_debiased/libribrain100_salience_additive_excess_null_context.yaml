# LibriBrain100 英语 MEG 阶段 2.1（方案 1a）：冻结 CNN + 词内显著性门控加性跨词注意力 + 超额相干错位零空间去偏配置
extends: ./libribrain100_siamese_debiased_context.yaml

model:
  transformer:
    architecture: salience_gated_additive
    heads: 16
    head_dimension: 32
    max_relative_distance: 24
    residual_max_norm: 0.65
    attention_dropout: 0.1

training:
  epochs: 30
  batch_size: 128
  eval_batch_size: 512
  learning_rate: 3.0e-4
  weight_decay: 0.01
  patience: 6
  early_stop_metric: full_vocab
  freeze_brain_encoder_epochs: 30

siamese_debiased:
  enabled: true
  debias_mode: null_space
  shift_mode: preroll
  preroll_seconds: 55.0
  eta_0: 0.50
  eta_train: 0.50
  lambda_null: 10.0
  lambda_delta: 0.0
  null_space_coherent_mean: true
  null_space_excess_coherent: true
  null_space_excess_tolerance: 0.08
  null_space_increment_mode: true
  null_space_vocab_freq_alpha: 0.5
  shift_seconds: [-12.0, -19.0, -27.0, -36.0, -46.0]
  shifts_per_step: 5
  synchronize_dropout_rng: true
  preextract_frozen_cnn: true
  cache_preextracted_to_disk: true
