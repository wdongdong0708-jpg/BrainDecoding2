# ChineseEEG-2 中文《小王子》EEG 阶段 2.3（全历史因果前缀滚动修订 [1..i, i+r]）：保底档位 B（零脑信号纯时间几何摊销偏置头 b_psi(Delta_tau) 蒸馏抵消）
# 启动命令：
#   python -u -m braindecoding train --config configs/training/siamese_debiased/chineseeeg2_amortized_timing_prefix_revision.yaml --require-cache --resume auto
extends: ../chineseeeg2_prefix_revision.yaml

workflow:
  dataset: chineseeeg2_littleprince
  stage: prefix_revision
  subject: all
  precision: bf16-mixed
  window_seconds: 1.0
  window_start_offset_seconds: 0.0

training:
  epochs: 30
  batch_size: 128
  eval_batch_size: 512
  learning_rate: 1.0e-4
  weight_decay: 0.01
  patience: 6
  early_stop_metric: full_vocab
  freeze_brain_encoder_epochs: 30
  preserve_complete_groups: true
  revision_cutoff_policy: all

siamese_debiased:
  enabled: true
  debias_mode: amortized_timing
  shift_mode: preroll
  preroll_seconds: 45.0
  shift_seconds: [-10.0, -20.0, -30.0, -40.0]
  shifts_per_step: 1
  eta_0: 0.50
  eta_train: 0.50
  eta_delta: 0.0
  lambda_distill: 1.0
  lambda_null: 0.05
  lambda_delta: 0.0
  lambda_delta_null: 0.0
  beta_delta_cm: 0.0
  s3_cms_eta: 0.0
  synchronize_dropout_rng: true
  preextract_frozen_cnn: true
  cache_preextracted_to_disk: true
