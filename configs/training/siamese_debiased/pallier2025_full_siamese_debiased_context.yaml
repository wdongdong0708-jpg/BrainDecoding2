# Pallier2025 全量法语 MEG 阶段 2.1：冻结 CNN + 整句联合编码 + 孪生共模抵消与错位零化正则训练配置（对齐原版 pallier2025 R4）
extends: ../pallier2025_full_context_transformer.yaml

workflow:
  dataset: pallier2025_full
  stage: context
  subject: all
  precision: bf16-mixed
  window_seconds: 1.0
  window_start_offset_seconds: 0.0

training:
  epochs: 30
  batch_size: 128
  eval_batch_size: 512
  learning_rate: 1.0e-4
  weight_decay: 0.01
  patience: 6
  freeze_brain_encoder_epochs: 30

siamese_debiased:
  enabled: true
  debias_mode: legacy_siamese
  shift_mode: deterministic_circular
  eta_0: 0.50
  eta_train: 0.50
  lambda_null: 10.0
  shift_seconds: [-15.0, -30.0, -45.0, -60.0, -90.0, -120.0]
  shifts_per_step: 6
  synchronize_dropout_rng: true
  preextract_frozen_cnn: true
  cache_preextracted_to_disk: true
