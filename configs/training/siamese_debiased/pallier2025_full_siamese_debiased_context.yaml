# Pallier2025 全量法语 MEG 阶段 2.1：冻结 CNN + 整句联合编码 + 错位词间隔窗口去偏训练配置
extends: ../pallier2025_full_context_transformer.yaml

workflow:
  dataset: pallier2025_full
  stage: context
  subject: all
  precision: bf16-mixed
  window_seconds: 1.0
  window_start_offset_seconds: 0.0

training:
  epochs: 30
  batch_size: 128
  eval_batch_size: 512
  learning_rate: 1.0e-4
  weight_decay: 0.01
  patience: 6
  freeze_brain_encoder_epochs: 30

siamese_debiased:
  enabled: true
  debias_mode: legacy_siamese
  shift_mode: preroll
  preroll_seconds: 45.0
  eta_0: 0.50
  eta_train: 0.50
  lambda_null: 10.0
  shift_seconds: [-12.0, -19.0, -27.0, -36.0]
  shifts_per_step: 4
  synchronize_dropout_rng: true
  preextract_frozen_cnn: true
  cache_preextracted_to_disk: true
