# ChineseEEG-2 中文《小王子》EEG 阶段 2.2：跨状态回修增量零化 + 状态非对称去偏梯度 + 冻结 CNN 预提取极速训练配置
# （Cross-Horizon Revision-Delta Nullification + Horizon-Asymmetric Schedule + Pre-Extracted Frozen CNN）
#
# 启动命令：
#   python -u -m braindecoding train --config configs/training/siamese_debiased/chineseeeg2_siamese_debiased_revision_rolling_delta.yaml --require-cache --resume auto
extends: ../chineseeeg2_rolling_revision.yaml

workflow:
  dataset: chineseeeg2_littleprince
  stage: revision
  subject: all
  precision: bf16-mixed
  window_seconds: 1.0
  window_start_offset_seconds: 0.0
  exp_tag: rolling_delta_debiased
  word_exp_tag: default

training:
  epochs: 30
  batch_size: 128
  eval_batch_size: 512
  learning_rate: 1.0e-4
  weight_decay: 0.01
  patience: 6
  freeze_brain_encoder_epochs: 30
  preserve_complete_groups: true
  revision_cutoff_policy: all

siamese_debiased:
  enabled: true
  eta_train: 0.5
  lambda_null: 10.0
  # 机制一：跨状态回修增量零化正则权重（惩罚 r in {1, 2} 相对 K0 的错位跳变）
  lambda_delta_null: 20.0
  # 前向跨状态增量共模额外扣除权重
  eta_delta_train: 0.30
  # 机制二：按状态 K0, K1, K2 非对称配置的孪生共模扣除与静态零化权重
  eta_train_by_horizon: [0.30, 0.80, 0.80]
  lambda_null_by_horizon: [5.0, 20.0, 20.0]
  shift_seconds: [-15.0, -30.0, -45.0, -60.0, -90.0, -120.0]
  shifts_per_step: 6
  synchronize_dropout_rng: true
  preextract_frozen_cnn: true
  cache_preextracted_to_disk: true
