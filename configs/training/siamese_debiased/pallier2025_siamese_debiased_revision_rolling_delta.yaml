# Pallier2025 法语 MEG 阶段 2.2：跨状态回修增量零化 + 状态非对称去偏梯度 + 冻结 CNN 预提取极速训练配置
# （Cross-Horizon Revision-Delta Nullification + Horizon-Asymmetric Schedule + Pre-Extracted Frozen CNN）
#
# 核心物理机制：
#   1. 初判态 K0 窗口 [i-2, i-1, i] 在物理上看不到目标词时长 Delta_tau_i = tau_{i+1} - tau_i；
#      而回修态 K1, K2 随未来词窗 x_{i+1}, x_{i+2} 到达瞬间暴露了 Delta_tau_i。
#   2. 跨状态回修增量零化（Cross-Horizon Revision-Delta Nullification, lambda_delta_null）：
#      直接对错位分支从 K0 -> K1, K2 的回修跳变 (y_shift^(r) - sg(y_shift^(0))) 施加中心化词表零化惩罚，
#      锁死随未来窗口打开而注入的词长捷径，使 K1, K2 的 Raw Shift 锚定在 K0 的随机基线水平。
#   3. 状态非对称去偏梯度（Horizon-Asymmetric Schedule, eta_train_by_horizon / lambda_null_by_horizon）：
#      对 K0 采取温和扣除（0.30 / 5.0）保护初判信噪比，对 K1, K2 采取强力扣除（0.80 / 20.0）封杀未来词长捷径。
#   4. 默认设置 exp_tag: rolling_delta_debiased，自动与原有实验目录物理隔离，绝不覆盖既有结果。
#
# 启动命令：
#   python -u -m braindecoding train --config configs/training/siamese_debiased/pallier2025_siamese_debiased_revision_rolling_delta.yaml --require-cache --resume auto
extends: ../pallier2025_rolling_revision.yaml

workflow:
  dataset: pallier2025
  stage: revision
  subject: all
  precision: bf16-mixed
  window_seconds: 1.0
  window_start_offset_seconds: 0.0
  exp_tag: rolling_delta_debiased
  word_exp_tag: default

training:
  epochs: 30
  batch_size: 128
  eval_batch_size: 512
  learning_rate: 1.0e-4
  weight_decay: 0.01
  patience: 6
  freeze_brain_encoder_epochs: 30
  preserve_complete_groups: true
  revision_cutoff_policy: all

siamese_debiased:
  enabled: true
  eta_train: 0.5
  lambda_null: 10.0
  # 机制一：跨状态回修增量零化正则权重（惩罚 r in {1, 2} 相对 K0 的错位跳变）
  lambda_delta_null: 20.0
  # 前向跨状态增量共模额外扣除权重（可选，默认 0.30 叠加在 eta_train_by_horizon 之上）
  eta_delta_train: 0.30
  # 机制二：按状态 K0, K1, K2 非对称配置的孪生共模扣除与静态零化权重
  eta_train_by_horizon: [0.30, 0.80, 0.80]
  lambda_null_by_horizon: [5.0, 20.0, 20.0]
  shift_seconds: [-15.0, -30.0, -45.0, -60.0, -90.0, -120.0]
  shifts_per_step: 6
  synchronize_dropout_rng: true
  preextract_frozen_cnn: true
  cache_preextracted_to_disk: true
