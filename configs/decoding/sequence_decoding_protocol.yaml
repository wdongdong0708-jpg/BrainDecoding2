protocol:
  name: sequence_decoding_s3
  version: 2
  description: >
    Stage 3 (S3) unified left-to-right beam search across the 4-tier input latency
    budget (Isolated S0 1.00s, Rolling-K0 1.00s, Rolling-K1 1.27s, Rolling-K2 1.50s,
    and optional Full-Context 3.31s), state-adaptive monotonic (T_r, lambda_r >= 0.05)
    calibration, |V| in {50, 100, 250} core vocabulary & k in {1, 2, 5, 10} multi-subject
    scaling, and decoupled C-gated streaming screen anti-flicker analysis.

language_model:
  model_name_or_path: Qwen/Qwen3-8B-Base
  fallback_models:
    - Qwen/Qwen3-8B-Base
    - Qwen/Qwen3-4B-Base
  precision: bf16-mixed
  score_batch_size: 256
  max_prefix_cache_states: 1024
  context_tokens: 8192

decoding:
  architecture: unified_left_to_right_beam_search_with_streaming_screen_audit
  beam_width: 5
  candidate_top_k: 20
  segment_batch_size: 128
  states:
    - S0
    - K0
    - K1
    - K2
    - F
  baselines:
    - LM-Only
    - S0
    - K0
    - K1
    - S3
    - F

calibration:
  split: val
  use_calibration_partition: true
  calibration_fraction: 0.2
  max_calibration_segments: 64
  adjacent_components_per_block: 5
  metric: composite
  enforce_monotonic_lambda: true
  shared_language_weight: false
  min_language_weight: 0.05
  temperature_grid:
    - 0.05
    - 0.07
  language_weight_grid:
    - 0.05
    - 0.10
    - 0.15
    - 0.25
    - 0.40
    - 0.60

control:
  common_mode_subtraction:
    enabled: true
    subtraction_eta: 0.0
    background_shift_seconds:
      - -15.0
      - -30.0
      - -45.0
      - -60.0
      - -90.0
      - -120.0
  shifted_negative_control:
    control_type: unseen_historical_circular_shift
    same_subject: true
    same_recording: true
    control_shift_seconds: -75.0

evaluation:
  metrics:
    - bleu1_pct
    - corpus_bleu1_pct
    - beam_oracle_bleu1_pct
    - wer_pct
    - cer_pct
    - word_acc_pct
    - in_vocabulary_word_acc_pct
    - word_acc_top5_pct
    - content_word_acc_pct
    - function_word_acc_pct
    - bertscore_f1_pct
  multi_subject_observations:
    - 1
    - 2
    - 5
    - 10
  multi_subject_vocabulary_sizes:
    - 50
    - 100
    - 250
    - 2020
  core_vocabulary_size: 250
  core_vocabulary_sizes:
    - 50
    - 100
    - 250
  vocabulary_scaling_sizes:
    - 50
    - 100
    - 250
    - 500
    - 1000
    - 2020
  confidence_gate:
    enabled: true
    tau_min: 0.0
    tau_max: 2.0
    tau_step: 0.1
