# Stage 3 (S3) 序列解码协议：Global-EMA(0.5) 在线因果共模扣除 + Pre-Roll 负对照 + 简化句子解码协议 (L >= 5 句表同源闭集)
# 输出子目录：causal_simple_sequence_decoding（与旧版 simple_sequence_decoding 物理隔离，0 字节覆盖）
extends: sequence_decoding_protocol.yaml

decoding:
  protocol_mode: l5_sentence_matched_closed_set
  min_sentence_length: 5
  sequence_subdir: causal_simple_sequence_decoding

control:
  common_mode_subtraction:
    enabled: true
    mode: causal_ema
    ema_decay: 0.99
    subtraction_eta: 0.5
  shifted_negative_control:
    shift_mode: preroll
    preroll_seconds: 45.0
    control_shift_seconds: -75.0

evaluation:
  min_sentence_length: 5
  core_vocabulary_size: full
  core_vocabulary_sizes:
    - 50
    - 100
    - full
  multi_subject_vocabulary_sizes:
    - 50
    - 100
    - full
  vocabulary_scaling_sizes:
    - 50
    - 100
    - full
