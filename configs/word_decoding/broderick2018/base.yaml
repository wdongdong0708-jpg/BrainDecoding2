dataset:
  id: broderick2018
  name: Broderick2018-NaturalSpeech-EEG
  dryad_doi: 10.5061/dryad.070jc
  root: ${BRAINDATA_ROOT}/Broderick2018_NaturalSpeech
  subjects: [sub-01, sub-02, sub-03, sub-04, sub-05, sub-06, sub-07, sub-08, sub-09, sub-10, sub-11, sub-12, sub-13, sub-14, sub-15, sub-16, sub-17, sub-18, sub-19]
  runs: [run-01, run-02, run-03, run-04, run-05, run-06, run-07, run-08, run-09, run-10, run-11, run-12, run-13, run-14, run-15, run-16, run-17, run-18, run-19, run-20]
  canonical_scope: sub01-19
  context_grouping: run_and_gentle_aligned_sentence_id
  max_context_words: 128
  silence_sentence_gap_seconds: 0.45
  min_matched_words: 450
  normalization: strip_lower_ascii_alnum_apostrophe_hyphen
  window_contract_version: word_1s_support_3s_baseline_0p5_v1
  window_start_offset_seconds: 0.0
  window_seconds: 1.0 # 模型实际接收 onset 后 1 秒 EEG
  eligibility_window_seconds: 3.0 # 3s 事件资格窗口
  baseline_seconds: 0.5 # 相对 1 秒词窗口起点
  clamp: 5.0
  source_sampling_rate_hz: 128.0
  expected_source_sampling_rate_hz: 128.0
  target_sampling_rate_hz: 50.0
  filter_low_hz: 0.1
  filter_high_hz: 40.0
  scaler: RobustScaler
  mastoid_rereference: false
  mne_n_jobs: -1
  signal_materialization_version: 1
  expected_eeg_channel_count: 128
  channel_names_sha256: 1479fb94f790171627f8dead8f5e85c15e384c3576f384043e77fb583076d947
  split_manifest: data/manifests/broderick2018/run_split.json
  training_vocabulary_policy: all_trainable_train_events_with_text_embedding
  evaluation_vocabulary_policy: frozen_train_only_frequency_desc_word_asc

cache:
  event_table: data/cache/derived/broderick2018/events/events.csv
  eeg_dir: data/cache/derived/broderick2018/signals/eeg_50hz
  text_embeddings: data/cache/derived/broderick2018/text/t5_large_layer_0_5/embeddings.npz

text_embedding:
  model_name: t5-large
  layer_fraction: 0.5
  token_aggregation: mean
  add_special_tokens: false
  embedding_dimension: 1024
  batch_size: 32
  device: cpu
  local_files_only: false
  word_normalization: canonical_standard_word

model:
  embedding_dimension: 1024
  use_transformer: true
  context_mode: grouped
  conv:
    merger_channels: 270
    merger_position_dimension: 2048
    merger_per_subject: true
    merger_dropout: 0.2
    initial_linear: 512
    hidden: 160
    depth: 5
    kernel_size: 3
    dilation_growth: 2
    dilation_period: 5
    dropout_input: 0.1
    convolution_dropout: 0.0
    batch_norm: true
    gelu: true
    skip: true
    glu_every: 2
    glu_context: 1
    temporal_attention_hidden: 256
  transformer:
    depth: 16
    heads: 16
    attention_dropout: 0.1
    feedforward_dropout: 0.0
    use_scalenorm: true
    use_rmsnorm: false
    rotary_position_embedding: true
    residual_attention: false
    scale_residual: true

loss:
  name: SigLip
  initial_temperature: 10.0
  initial_bias: -10.0
  identical_candidates_threshold: 0.999

training:
  seed: 0
  device: auto
  batch_size: 128
  num_workers: 0
  epochs: 30
  patience: 10
  learning_rate: 0.0001
  weight_decay: 0.0
  minimum_learning_rate: 0.0
  max_grad_norm: 0.0
  amp: true
  top_ks: [1, 10]
  smoke_rows: 64

evaluation:
  default_split: val
  zero_eeg_control: false
  vocabulary_manifest_dir: data/manifests/broderick2018
  vocabulary_sizes: [20, 50, 100, 150]
  selection_vocabulary_size: 50
  selection_metric: retrieval_acc10_vocab=broderick2018_50_macro

provenance:
  raw_dataset_name: Broderick2018-NaturalSpeech-EEG
  dryad_doi: 10.5061/dryad.070jc
  stage: canonical_experiment_contract_frozen
  preprocessing_reference_commit: e1262ee36aa2fbaa6965e5bfb893f6aaee0dd693
  signal_materialization: deterministic_canonical
  text_embedding: canonical_t5_large_layer_0_5
  model_evaluation: not_run
  test_neural_data_status: raw_accessed_for_deterministic_preprocessing_only
  test_model_evaluation: not_run
  test_predictions_generated: false
  test_metrics_inspected: false
