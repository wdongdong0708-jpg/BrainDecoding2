dataset:
  id: pallier2025
  name: LittlePrince_MEG_French_Listen_Pallier2025
  openneuro_id: ds007523
  root: ${BRAINDATA_ROOT}/LittlePrince_MEG_French_Listen_Pallier2025
  session: ses-01
  subjects: [sub-01, sub-02, sub-03, sub-04, sub-05, sub-06, sub-07, sub-08, sub-09, sub-10]
  runs: [run-01, run-02, run-03, run-04, run-05, run-06, run-07, run-08, run-09]
  canonical_scope: sub01-10
  context_grouping: run_and_extra_info_sequence_id
  max_context_words: 128
  normalization: strip_lower_preserve_french_accents_and_tokenization
  window_contract_version: word_1s_support_3s_baseline_0p5_v1
  window_start_offset_seconds: 0.0
  window_seconds: 1.0 # 模型实际接收 onset 后 1 秒 MEG
  eligibility_window_seconds: 3.0 # 3s事件资格窗口
  baseline_seconds: 0.5 # 相对 1 秒词窗口起点
  clamp: 5.0
  source_sampling_rate_hz: 1000.0
  target_sampling_rate_hz: 50.0
  filter_low_hz: 0.1
  filter_high_hz: 40.0
  scaler: RobustScaler
  mne_n_jobs: -1
  signal_materialization_version: 1
  expected_meg_channel_count: 306
  expected_magnetometer_count: 102
  expected_gradiometer_count: 204
  channel_names_sha256: 807ff5cf39a18398f004221d596241033e9c55c91f031842069120d10dbf9fb8
  split_manifest: data/manifests/pallier2025/run_split.json
  qc_artifact: data/cache/artifacts/annotations/pallier2025/sub-09_run-03_qc.json
  training_vocabulary_policy: all_trainable_train_events_with_text_embedding
  evaluation_vocabulary_policy: frozen_train_only_frequency_desc_word_asc
  expected_trainable_counts:
    train: 115290
    val: 16960
    test: 18450

cache:
  event_table: data/cache/derived/pallier2025/events/events.csv
  meg_dir: data/cache/derived/pallier2025/signals/meg_50hz
  text_embeddings: data/cache/derived/pallier2025/text/t5_large_layer_0_5/embeddings.npz

text_embedding:
  model_name: t5-large
  layer_fraction: 0.5
  token_aggregation: mean
  embedding_dimension: 1024
  batch_size: 32
  device: cpu
  local_files_only: true
  word_normalization: canonical_standard_word

model:
  embedding_dimension: 1024
  use_transformer: true
  context_mode: grouped
  conv:
    merger_channels: 270
    merger_position_dimension: 2048
    merger_per_subject: true
    merger_dropout: 0.2
    initial_linear: 512
    hidden: 160
    depth: 5
    kernel_size: 3
    dilation_growth: 2
    dilation_period: 5
    dropout_input: 0.1
    convolution_dropout: 0.0
    batch_norm: true
    gelu: true
    skip: true
    glu_every: 2
    glu_context: 1
    temporal_attention_hidden: 256
  transformer:
    depth: 16
    heads: 16
    attention_dropout: 0.1
    feedforward_dropout: 0.0
    use_scalenorm: true
    use_rmsnorm: false
    rotary_position_embedding: true
    residual_attention: false
    scale_residual: true

loss:
  name: SigLip
  initial_temperature: 10.0
  initial_bias: -10.0
  identical_candidates_threshold: 0.999

training:
  seed: 0
  device: auto
  batch_size: 128
  num_workers: 0
  epochs: 30
  patience: 10
  learning_rate: 0.0001
  weight_decay: 0.0
  minimum_learning_rate: 0.0
  max_grad_norm: 0.0
  amp: true
  top_ks: [1, 10]
  smoke_rows: 64

evaluation:
  default_split: val
  zero_meg_control: false
  vocabulary_manifest_dir: data/manifests/pallier2025
  vocabulary_sizes: [20, 50, 100, 150]
  selection_vocabulary_size: 50
  selection_metric: retrieval_acc10_vocab=pallier2025_50_macro

provenance:
  raw_dataset_name: LittlePrince_MEG_French_Listen_Pallier2025
  openneuro_id: ds007523
  stage: canonical_experiment_contract_frozen
  preprocessing_reference_commit: e1262ee36aa2fbaa6965e5bfb893f6aaee0dd693
  signal_materialization: deterministic_canonical
  text_embedding: canonical_t5_large_layer_0_5
  model_evaluation: not_run
  test_neural_data_status: raw_accessed_for_deterministic_preprocessing_only
  test_model_evaluation: not_run
  test_predictions_generated: false
  test_metrics_inspected: false
